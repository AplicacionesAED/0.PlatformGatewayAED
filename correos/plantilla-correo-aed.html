<!doctype html>
<!--
  PLANTILLA DE CORREO AED (HTML para Outlook y web)
  Reemplaza cada {{MARCA}} por su contenido. Todo el estilo va en línea (los clientes de correo ignoran las hojas de estilo).
    {{ASUNTO}}       Título de la pestaña (no se muestra en el correo).
    {{PREVISTA}}     Frase corta que Outlook muestra junto al asunto en la bandeja.
    {{TITULO}}       Título grande de la franja azul (una línea o dos).
    {{CONTENIDO}}    Cuerpo del mensaje en HTML: párrafos <p style="margin:0 0 14px 0;"> ... </p>, <strong>, listas, tablas.
    {{BOTON_TEXTO}} / {{BOTON_URL}}   Botón de acción. Si el correo no lleva botón, borra el bloque entre "BOTON" y "FIN BOTON".
    {{FIRMA_NOMBRE}} / {{FIRMA_CARGO}}  Firma al pie.
  Colores de marca (tokens de las apps): azul profundo #0B2D4D, azul AED #232BED, verde AED #23FF55.
  Recuadro destacado opcional (para avisos tipo "Qué cambia"): dentro de {{CONTENIDO}} usa
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#E8E9FD;border-radius:10px;margin:0 0 18px 0;"><tr><td style="padding:18px 20px;font-size:15px;line-height:1.6;">
      <div style="font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#232BED;font-weight:700;margin-bottom:8px;">TÍTULO DEL RECUADRO</div>
      ...viñetas o texto...
    </td></tr></table>
  Ejemplo completo: correos/ejemplos/2026-11-20-lanzamiento-solicitudes-directas.html
  Envío: dejar siempre como BORRADOR en Outlook (cuenta de AED) y enviar una prueba solo a uno mismo antes del envío masivo.
  El logo se carga desde el portal (https://portal.aed-it.com/aed-logo.png): requiere que ese archivo siga publicado.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ASUNTO}}</title>
</head>
<body style="margin:0;padding:0;background:#EEF0FB;font-family:'Segoe UI',Arial,Helvetica,sans-serif;color:#1B2433;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#EEF0FB;">{{PREVISTA}}</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#EEF0FB;">
<tr><td align="center" style="padding:24px 12px;">

<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:#FFFFFF;border-radius:14px;overflow:hidden;">

  <!-- Logo -->
  <tr><td style="padding:22px 36px 20px 36px;background:#FFFFFF;">
    <a href="https://portal.aed-it.com/" target="_blank" style="text-decoration:none;"><img src="https://portal.aed-it.com/aed-logo.png" width="84" alt="aed" style="display:block;border:0;outline:none;width:84px;height:auto;"></a>
  </td></tr>
  <tr><td style="height:4px;line-height:4px;font-size:0;background:#23FF55;">&nbsp;</td></tr>

  <!-- Título -->
  <tr><td style="background:#0B2D4D;padding:30px 36px 28px 36px;">
    <div style="font-size:27px;line-height:1.25;color:#FFFFFF;font-weight:700;">{{TITULO}}</div>
  </td></tr>

  <!-- Contenido -->
  <tr><td style="padding:30px 36px 8px 36px;font-size:16px;line-height:1.6;color:#1B2433;">
    {{CONTENIDO}}
  </td></tr>

  <!-- BOTON -->
  <tr><td align="center" style="padding:18px 36px 10px 36px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td align="center" style="background:#232BED;border-radius:10px;">
      <a href="{{BOTON_URL}}" target="_blank" style="display:inline-block;padding:15px 38px;font-size:17px;font-weight:700;color:#FFFFFF;text-decoration:none;font-family:'Segoe UI',Arial,Helvetica,sans-serif;">{{BOTON_TEXTO}}</a>
    </td></tr></table>
  </td></tr>
  <!-- FIN BOTON -->

  <!-- Firma -->
  <tr><td style="padding:20px 36px 30px 36px;font-size:15px;line-height:1.6;color:#1B2433;">
    Saludos,<br><strong>{{FIRMA_NOMBRE}}</strong><br><span style="color:#4A5568;">{{FIRMA_CARGO}}</span>
  </td></tr>

  <!-- Pie -->
  <tr><td style="background:#F5F7FD;padding:18px 36px;font-size:12px;line-height:1.5;color:#6B7585;text-align:center;">
    <strong style="color:#0B2D4D;">AED Constructores</strong><br>Este mensaje es de uso interno. Si lo recibiste por error, avísanos respondiendo a este correo.
  </td></tr>

</table>

</td></tr>
</table>
</body>
</html>
